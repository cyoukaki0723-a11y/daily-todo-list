<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Portfolio | Interactive Experience</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Entry Page Styles */
        .entry-page {
            position: relative;
            width: 100%;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            perspective: 1000px;
        }

        .modules-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            height: 600px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Circular Modules */
        .module {
            position: absolute;
            cursor: pointer;
            transition: all 0.3s ease;
            animation: float 3s ease-in-out infinite;
        }

        .module-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            border: 3px solid rgba(255, 255, 255, 0.3);
            position: relative;
            overflow: hidden;
        }

        .module-circle::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, transparent 30%, rgba(255, 255, 255, 0.3) 50%, transparent 70%);
            transform: translateX(-100%);
            animation: shine 3s infinite;
        }

        @keyframes shine {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .module:hover .module-circle {
            transform: scale(1.15);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            border-color: rgba(255, 255, 255, 0.6);
        }

        .module-icon {
            font-size: 40px;
            margin-bottom: 5px;
            transition: transform 0.3s ease;
        }

        .module:hover .module-icon {
            transform: scale(1.2);
        }

        .module-label {
            font-size: 12px;
            font-weight: 600;
            color: white;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Module Positions (Orbital Layout) */
        .module:nth-child(1) { animation-delay: 0s; }
        .module:nth-child(2) { animation-delay: 0.5s; }
        .module:nth-child(3) { animation-delay: 1s; }
        .module:nth-child(4) { animation-delay: 1.5s; }
        .module:nth-child(5) { animation-delay: 2s; }
        .module:nth-child(6) { animation-delay: 2.5s; }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        /* Position modules in a circular pattern */
        .module {
            width: 140px;
            height: 140px;
        }

        .module[data-module="study"] {
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
        }

        .module[data-module="internship"] {
            top: 40px;
            right: -30px;
        }

        .module[data-module="work"] {
            bottom: 40px;
            right: -30px;
        }

        .module[data-module="skills"] {
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
        }

        .module[data-module="mbti"] {
            bottom: 40px;
            left: -30px;
        }

        .module[data-module="evaluations"] {
            top: 40px;
            left: -30px;
        }

        /* Center Info Circle */
        .center-info {
            position: absolute;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            z-index: 10;
            animation: centerPulse 2s ease-in-out infinite;
        }

        @keyframes centerPulse {
            0%, 100% { box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3); }
            50% { box-shadow: 0 30px 80px rgba(102, 126, 234, 0.4); }
        }

        .center-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            overflow: hidden;
            margin-bottom: 10px;
            border: 3px solid #667eea;
            flex-shrink: 0;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .center-name {
            font-size: 16px;
            font-weight: 700;
            color: #333;
            margin-bottom: 3px;
        }

        .center-title {
            font-size: 11px;
            color: #667eea;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .center-social {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .social-icon {
            font-size: 8px;
            padding: 3px 6px;
            background: #667eea;
            color: white;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .social-icon:hover {
            background: #764ba2;
            transform: scale(1.1);
        }

        /* Sub-items Page Styles */
        .subitems-page {
            display: none;
            width: 100%;
            min-height: 100vh;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .subitems-page.active {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            animation: slideIn 0.3s ease;
        }

        .subitems-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            height: 600px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .subitem {
            position: absolute;
            cursor: pointer;
            transition: all 0.3s ease;
            animation: float 3s ease-in-out infinite;
        }

        .subitem-circle {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            border: 3px solid rgba(255, 255, 255, 0.3);
            position: relative;
            overflow: hidden;
            font-size: 14px;
            font-weight: 600;
            color: white;
            text-align: center;
            padding: 10px;
        }

        .subitem:hover .subitem-circle {

            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            border-color: rgba(255, 255, 255, 0.6);
        }

        /* Detail Page Styles */

            width: 100%;
            min-height: 100vh;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .detail-page.active {

            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .detail-container {

            margin: 0 auto;
            background: white;

            padding: 30px;

            flex-direction: column;
        }

        .detail-header {

            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .back-btn {

            height: 40px;
            border-radius: 50%;
            background: #667eea;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }

        .back-btn:hover {
            background: #764ba2;
            transform: scale(1.1);
        }

        .detail-title {
            font-size: 28px;
            color: #333;
            margin: 0;
        }

        .detail-content {
            flex: 1;
            overflow-y: auto;
        }

        .content-section {
            margin-bottom: 25px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            color: #667eea;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .content-item {

            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #667eea;
            position: relative;
        }

        .edit-btn {

            top: 10px;
            right: 10px;
            background: #667eea;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s ease;
        }

        .edit-btn:hover {
            background: #764ba2;
        }

        .item-title {
            font-size: 15px;
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .item-subtitle {
            font-size: 12px;
            color: #667eea;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .item-description {
            font-size: 14px;
            color: #666;
            line-height: 1.5;
        }

        .skill-tags {

            margin-top: 10px;

        .skill-tag {

            background: #667eea;
            color: white;

            font-size: 12px;
            font-weight: 600;
        }

        .rating {

        }

        .star.filled {
            color: #f39c12;
        }

        .star.empty {
            color: #ddd;
        }

        /* Edit Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideIn 0.3s ease;
        }

        .modal-header {
            font-size: 24px;
            font-weight: 700;
            color: #333;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #667eea;
            transition: all 0.3s ease;
        }

        .close-btn:hover {
            color: #764ba2;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            font-family: inherit;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 2px rgba(102, 126, 234, 0.1);
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .save-btn {
            background: #667eea;
            color: white;
        }

        .save-btn:hover {
            background: #764ba2;
        }

        .cancel-btn {
            background: #f0f0f0;
            color: #333;
        }

        .cancel-btn:hover {
            background: #e0e0e0;
        }

        /* Navigation Bar */
        .nav-bar {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            gap: 10px;
            z-index: 100;
        }

        .nav-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: white;
            color: #667eea;
            border: none;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

            background: #667eea;
            color: white;

        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .modules-container,
            .subitems-container {

                max-width: 400px;
            }

            .module {

                height: 100px;
            }

            .module-circle {
                width: 100px;
                height: 100px;
            }

            .module-icon {
                font-size: 32px;

            .module-label {

            .center-info {

            .center-avatar {

                height: 60px;

            .center-name {

            .detail-container {

            .detail-title {
                font-size: 24px;
            }

            .modal-content {
                width: 95%;
            }
        }

        @media (max-width: 480px) {
            .modules-container,
            .subitems-container {
                height: 450px;
            }

            .module {
                width: 90px;
                height: 90px;
            }

            .module-circle {
                width: 90px;
                height: 90px;
            }

            .module-icon {
                font-size: 28px;
            }

            .center-info {
                width: 130px;
                height: 130px;
            }

            .entry-page {
                padding: 15px;
            }
        }
    </style>
</head>

                            tags: ['React', 'Vue.js', 'TypeScript', 'CSS/SCSS', 'Webpack', 'Responsive Design']
                        }
                    },
                    {
                        id: 'skills-2',
                        name: 'Backend\nDevelopment',
                        details: {
                            title: 'Backend Development Skills',
                            subtitle: 'Server Technologies',
                            description: 'Strong backend development skills with focus on scalable architecture and database optimization. Experience with both relational and NoSQL databases.',
                            tags: ['Node.js', 'Python', 'PostgreSQL', 'MongoDB', 'GraphQL', 'REST API']
                        }
                    },
                    {
                        id: 'skills-3',
                        name: 'DevOps & Tools',
                        details: {
                            title: 'DevOps & Tools',
                            subtitle: 'Infrastructure & Development Tools',
                            description: 'Proficient in deployment, containerization, and CI/CD pipelines. Experienced with cloud platforms and development tool ecosystems.',
                            tags: ['Docker', 'AWS', 'GitHub', 'CI/CD', 'Linux', 'Git']
                        }
                    }
                ]
            },
            mbti: {
                title: 'MBTI Personality',
                icon: '🧠',
                subitems: [
                    {
                        id: 'mbti-1',
                        name: 'INTJ\nThe Architect',
                        details: {
                            title: 'INTJ - The Architect Personality',
                            subtitle: 'Analytical, Strategic, Independent',
                            description: 'INTJs are strategic thinkers who thrive on solving complex problems. They are independent, analytical, and focused on long-term goals. Excel in leadership and strategic planning.',
                            tags: ['Strategic Planning', 'Logical Reasoning', 'Leadership', 'Innovation']
                        }
                    }
                ]
            },
            evaluations: {
                title: 'Evaluations & Feedback',
                icon: '⭐',
                subitems: [
                    {
                        id: 'eval-1',
                        name: 'Peer\nReviews',
                        details: {
                            title: 'Peer Reviews',
                            subtitle: 'Team Feedback',
                            description: 'Consistently receive positive feedback from colleagues. Known for collaboration, code quality, and willingness to help teammates. Strong communicator and problem solver.',
                            tags: ['Collaboration', 'Code Quality', 'Communication']
                        }
                    },
                    {
                        id: 'eval-2',
                        name: 'Manager\nFeedback',
                        details: {
                            title: 'Manager Feedback',
                            subtitle: 'Performance Evaluation',
                            description: 'Strong technical skills and consistent delivery. Shows great potential for leadership roles. Proactive in identifying improvements and implementing solutions.',
                            tags: ['Leadership Potential', 'Technical Excellence', 'Reliability']
                        }
                    }
                ]
            }
        };

        let currentModule = null;
        let currentSubitem = null;
        let editingItem = null;

        // Initialize modules
        document.addEventListener('DOMContentLoaded', () => {
            const modules = document.querySelectorAll('.module');
            modules.forEach(module => {
                module.addEventListener('click', () => {
                    currentModule = module.dataset.module;
                    showSubitemsPage(currentModule);
                });
            });

            document.getElementById('backToModulesBtn').addEventListener('click', showEntryPage);
            document.getElementById('backToSubitemsBtn').addEventListener('click', showSubitemsPage);
            document.getElementById('closeModalBtn').addEventListener('click', closeModal);
            document.getElementById('cancelEditBtn').addEventListener('click', closeModal);
            document.getElementById('editForm').addEventListener('submit', saveEdit);

            // Load data from localStorage
            loadFromLocalStorage();
        });

        function showSubitemsPage(moduleType) {
            const entryPage = document.getElementById('entryPage');
            const subitemsPage = document.getElementById('subitemsPage');
            const detailPage = document.getElementById('detailPage');
            const subitemsContainer = document.getElementById('subitemsContainer');
            
            const data = moduleData[moduleType];
            const subitems = data.subitems;

            subitemsContainer.innerHTML = '';

            subitems.forEach((subitem, index) => {
                const angle = (index / subitems.length) * 360;
                const radius = 150;
                const x = Math.cos((angle * Math.PI) / 180) * radius;
                const y = Math.sin((angle * Math.PI) / 180) * radius;

                const subitemEl = document.createElement('div');
                subitemEl.className = 'subitem';
                subitemEl.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
                subitemEl.style.animationDelay = `${index * 0.2}s`;
                subitemEl.innerHTML = `
                    <div class="subitem-circle">${subitem.name}</div>
                `;

                subitemEl.addEventListener('click', () => {
                    currentSubitem = subitem;
                    showDetailPage(subitem);
                });

                subitemsContainer.appendChild(subitemEl);
            });

            entryPage.style.display = 'none';
            detailPage.classList.remove('active');
            subitemsPage.classList.add('active');
        }

        function showDetailPage(subitem) {
            const subitemsPage = document.getElementById('subitemsPage');
            const detailPage = document.getElementById('detailPage');
            const details = subitem.details;

            document.getElementById('detailTitle').textContent = details.title;
            
            let contentHTML = `
                <div class="content-section">
                    <div class="content-item">
                        <button class="edit-btn" onclick="openEditModal('${subitem.id}')">Edit</button>
                        <div class="item-title">${details.title}</div>
                        <div class="item-subtitle">${details.subtitle}</div>
                        <div class="item-description">${details.description}</div>
            `;
            
            if (details.tags && details.tags.length > 0) {
                contentHTML += `
                        <div class="skill-tags">
                            ${details.tags.map(tag => `<span class="skill-tag">${tag}</span>`).join('')}
                        </div>
                `;
            }

            contentHTML += `
                    </div>
                </div>
            `;

            document.getElementById('detailContent').innerHTML = contentHTML;

            subitemsPage.classList.remove('active');
            detailPage.classList.add('active');
        }

        function showEntryPage() {
            const entryPage = document.getElementById('entryPage');
            const subitemsPage = document.getElementById('subitemsPage');
            const detailPage = document.getElementById('detailPage');

            entryPage.style.display = 'flex';
            subitemsPage.classList.remove('active');
            detailPage.classList.remove('active');
        }

        function openEditModal(subitemId) {
            editingItem = findSubitemById(subitemId);
            
            if (!editingItem) return;

            document.getElementById('editTitle').value = editingItem.details.title;
            document.getElementById('editSubtitle').value = editingItem.details.subtitle;
            document.getElementById('editDescription').value = editingItem.details.description;
            document.getElementById('editTags').value = editingItem.details.tags.join(', ');

            const modal = document.getElementById('editModal');
            modal.classList.add('active');
        }

        function closeModal() {
            const modal = document.getElementById('editModal');
            modal.classList.remove('active');
            editingItem = null;
        }

        function saveEdit(e) {
            e.preventDefault();

            if (!editingItem) return;

            editingItem.details.title = document.getElementById('editTitle').value;
            editingItem.details.subtitle = document.getElementById('editSubtitle').value;
            editingItem.details.description = document.getElementById('editDescription').value;
            editingItem.details.tags = document.getElementById('editTags').value
                .split(',')
                .map(tag => tag.trim())
                .filter(tag => tag);

            // Refresh detail page
            if (currentSubitem && currentSubitem.id === editingItem.id) {
                showDetailPage(editingItem);
            }

            closeModal();
            saveToLocalStorage();
        }

        function findSubitemById(subitemId) {
            for (const module in moduleData) {
                const subitems = moduleData[module].subitems;
                const found = subitems.find(item => item.id === subitemId);
                if (found) return found;
            }
            return null;
        }

        function saveToLocalStorage() {
            localStorage.setItem('portfolioData', JSON.stringify(moduleData));
        }

        function loadFromLocalStorage() {
            const saved = localStorage.getItem('portfolioData');
            if (saved) {
                try {
                    const loadedData = JSON.parse(saved);
                    Object.assign(moduleData, loadedData);
                } catch (e) {
                    console.error('Error loading portfolio data:', e);
                }
            }
        }

        // Close modal when clicking outside
        document.getElementById('editModal').addEventListener('click', (e) => {
            if (e.target.id === 'editModal') {
                closeModal();
            }
        });
    </script>
</body>
</html>
