<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily To-Do List</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 600px;
            padding: 40px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
            font-size: 32px;
        }

        .subtitle {
            text-align: center;
            color: #999;
            margin-bottom: 30px;
            font-size: 14px;
        }

        /* Calendar Styles */
        .calendar-view {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .calendar-header h2 {
            color: #333;
            font-size: 24px;
            flex: 1;
            text-align: center;
        }

        .calendar-nav {
            display: flex;
            gap: 10px;
        }

        .calendar-nav button {
            padding: 8px 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .calendar-nav button:hover {
            background: #764ba2;
            transform: translateY(-2px);
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }

        .calendar-day-header {
            text-align: center;
            font-weight: 600;
            color: #667eea;
            padding: 10px;
            font-size: 12px;
        }

        .calendar-day {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 2px solid #eee;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            background: white;
            font-size: 13px;
            padding: 5px;
            position: relative;
        }

        .calendar-day:hover:not(.other-month):not(.disabled) {
            border-color: #667eea;
            background: #f8f9fa;
            transform: translateY(-2px);
        }

        .calendar-day.other-month {
            color: #ccc;
            cursor: default;
            background: #f8f9fa;
        }

        .calendar-day.selected {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: #667eea;
        }

        .calendar-day.today {
            border-color: #27ae60;
            font-weight: bold;
        }

        .calendar-day.today.selected {
            border-color: white;
        }

        .calendar-day.has-tasks .completion-indicator {
            position: absolute;
            bottom: 2px;
            font-size: 10px;
        }

        .completion-indicator {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #e74c3c;
            position: absolute;
            bottom: 3px;
            right: 3px;
        }

        .completion-indicator.partial {
            background: #f39c12;
        }

        .completion-indicator.complete {
            background: #27ae60;
        }

        .calendar-legend {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 20px;
            font-size: 13px;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .input-section {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .input-wrapper {
            flex: 1;
            min-width: 200px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #eee;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        select {
            padding: 12px 12px;
            border: 2px solid #eee;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            font-size: 14px;
            transition: border-color 0.3s;
            color: #333;
        }

        select:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
            white-space: nowrap;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .task-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .task-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            transition: all 0.3s;
            border-left: 4px solid #999;
        }

        .task-item.high {
            border-left-color: #e74c3c;
            background: rgba(231, 76, 60, 0.05);
        }

        .task-item.medium {
            border-left-color: #f39c12;
            background: rgba(243, 156, 18, 0.05);
        }

        .task-item.low {
            border-left-color: #27ae60;
            background: rgba(39, 174, 96, 0.05);
        }

        .task-item.completed {
            opacity: 0.6;
        }

        .task-item.completed .task-text {
            text-decoration: line-through;
            color: #999;
        }

        .task-item.readonly {
            opacity: 0.7;
        }

        .task-item.readonly input[type="checkbox"],
        .task-item.readonly .btn-edit,
        .task-item.readonly .btn-delete {
            pointer-events: none;
            opacity: 0.5;
        }

        input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #667eea;
        }

        .task-content {
            flex: 1;
        }

        .task-text {
            color: #333;
            font-size: 15px;
            margin-bottom: 5px;
            word-break: break-word;
        }

        .task-date {
            font-size: 11px;
            color: #999;
            margin-top: 3px;
        }

        .task-priority {
            display: inline-block;
            font-size: 11px;
            font-weight: 600;
            padding: 4px 8px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .task-priority.high {
            background: #e74c3c;
            color: white;
        }

        .task-priority.medium {
            background: #f39c12;
            color: white;
        }

        .task-priority.low {
            background: #27ae60;
            color: white;
        }

        .task-actions {
            display: flex;
            gap: 8px;
        }

        .btn-edit, .btn-delete {
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-edit {
            background: #3498db;
            color: white;
        }

        .btn-edit:hover {
            background: #2980b9;
            transform: translateY(-1px);
        }

        .btn-delete {
            background: #e74c3c;
            color: white;
        }

        .btn-delete:hover {
            background: #c0392b;
            transform: translateY(-1px);
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 15px;
            opacity: 0.5;
        }

        .filter-section {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 16px;
            border: 2px solid #eee;
            background: white;
            color: #666;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .filter-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .filter-btn:hover {
            border-color: #667eea;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            text-align: center;
        }

        .stat-item {
            flex: 1;
        }

        .stat-number {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 90%;
            max-width: 500px;
        }

        .modal-header {
            font-size: 20px;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
        }

        .modal-input-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 25px;
        }

        .modal-input-group label {
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }

        .modal-input-group input,
        .modal-input-group select {
            padding: 12px 15px;
            border: 2px solid #eee;
            border-radius: 8px;
            font-size: 14px;
        }

        .modal-input-group input:focus,
        .modal-input-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
        }

        .modal-actions button {
            flex: 1;
            padding: 12px;
        }

        .modal-actions .btn-cancel {
            background: #eee;
            color: #333;
        }

        .modal-actions .btn-cancel:hover {
            background: #ddd;
        }

        .modal-actions .btn-save {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .page-toggle {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .page-toggle button {
            padding: 10px 20px;
            font-size: 13px;
        }

        .page-toggle button.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .page-toggle button.inactive {
            background: #eee;
            color: #666;
        }

        .view-mode {
            display: none;
        }

        .view-mode.active {
            display: block;
        }

        .date-display {
            text-align: center;
            color: #999;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .date-display .selected-date {
            color: #667eea;
            font-weight: 600;
        }

        @media (max-width: 600px) {
            .container {
                padding: 25px;
            }

            h1 {
                font-size: 24px;
            }

            .input-section {
                flex-direction: column;
            }

            .input-wrapper {
                min-width: 100%;
            }

            .stats {
                flex-direction: row;
                gap: 10px;
            }

            .stat-number {
                font-size: 20px;
            }

            .calendar-day {
                font-size: 11px;
            }

            .calendar-header h2 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 Daily To-Do List</h1>
        <p class="subtitle">Stay organized and productive</p>

        <!-- Page Toggle -->
        <div class="page-toggle">
            <button class="active" onclick="switchView('calendar')">📅 Calendar View</button>
            <button class="inactive" onclick="switchView('tasks')">✅ Tasks View</button>
        </div>

        <!-- Calendar View -->
        <div id="calendarView" class="view-mode active">
            <div class="calendar-header">
                <button class="calendar-nav" onclick="previousMonth()">← Prev</button>
                <h2 id="calendarMonth">January 2026</h2>
                <button class="calendar-nav" onclick="nextMonth()">Next →</button>
            </div>

            <div class="calendar-legend">
                <div class="legend-item">
                    <div class="legend-dot" style="background: #27ae60;"></div>
                    <span>All Complete</span>
                </div>
                <div class="legend-item">
                    <div class="legend-dot" style="background: #f39c12;"></div>
                    <span>Partially Done</span>
                </div>
                <div class="legend-item">
                    <div class="legend-dot" style="background: #e74c3c;"></div>
                    <span>No Tasks</span>
                </div>
            </div>

            <div class="calendar-grid" id="calendarGrid"></div>

            <div class="date-display">
                Selected: <span class="selected-date" id="selectedDateDisplay">Today</span>
            </div>

            <button style="width: 100%; margin-bottom: 15px;" onclick="switchView('tasks')">View Tasks for Selected Date</button>
        </div>

        <!-- Tasks View -->
        <div id="tasksView" class="view-mode">
            <!-- Stats Section -->
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-number" id="totalTasks">0</div>
                    <div class="stat-label">Total Tasks</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="completedTasks">0</div>
                    <div class="stat-label">Completed</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="remainingTasks">0</div>
                    <div class="stat-label">Remaining</div>
                </div>
            </div>

            <!-- Input Section -->
            <div class="input-section" id="addTaskSection">
                <div class="input-wrapper">
                    <input type="text" id="taskInput" placeholder="Add a new task...">
                </div>
                <select id="prioritySelect">
                    <option value="high">🔴 High</option>
                    <option value="medium" selected>🟡 Medium</option>
                    <option value="low">🟢 Low</option>
                </select>
                <button onclick="addTask()">Add Task</button>
            </div>

            <!-- Filter Section -->
            <div class="filter-section">
                <button class="filter-btn active" onclick="filterTasks('all')">All</button>
                <button class="filter-btn" onclick="filterTasks('high')">🔴 High</button>
                <button class="filter-btn" onclick="filterTasks('medium')">🟡 Medium</button>
                <button class="filter-btn" onclick="filterTasks('low')">🟢 Low</button>
                <button class="filter-btn" onclick="filterTasks('completed')">✅ Completed</button>
            </div>

            <!-- Task List -->
            <div class="task-list" id="taskList">
                <div class="empty-state">
                    <div class="empty-state-icon">📭</div>
                    <div>No tasks yet. Add one to get started!</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div class="modal" id="editModal">
        <div class="modal-content">
            <div class="modal-header">Edit Task</div>
            <div class="modal-input-group">
                <label for="editTaskText">Task Description</label>
                <input type="text" id="editTaskText">
            </div>
            <div class="modal-input-group">
                <label for="editPriority">Priority Level</label>
                <select id="editPriority">
                    <option value="high">🔴 High</option>
                    <option value="medium">🟡 Medium</option>
                    <option value="low">🟢 Low</option>
                </select>
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeEditModal()">Cancel</button>
                <button class="btn-save" onclick="saveEdit()">Save Changes</button>
            </div>
        </div>
    </div>

    <script>
        let tasks = JSON.parse(localStorage.getItem('tasks')) || [];
        let currentFilter = 'all';
        let editingTaskId = null;
        let currentMonth = new Date(2026, 0, 1);
        let selectedDate = new Date();
        let isReadOnly = false;

        const daysOfWeek = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
        const monthNames = ['January', 'February', 'March', 'April', 'May', 'June',
                           'July', 'August', 'September', 'October', 'November', 'December'];

        // Initialize the app
        function init() {
            renderCalendar();
            renderTasks();
            updateStats();
            document.getElementById('taskInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    addTask();
                }
            });
        }

        // Switch between views
        function switchView(view) {
            document.querySelectorAll('.view-mode').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.page-toggle button').forEach(el => {
                el.classList.remove('active');
                el.classList.add('inactive');
            });

            if (view === 'calendar') {
                document.getElementById('calendarView').classList.add('active');
                document.querySelector('.page-toggle button:first-child').classList.add('active');
                document.querySelector('.page-toggle button:first-child').classList.remove('inactive');
                renderCalendar();
                isReadOnly = false;
                document.getElementById('addTaskSection').style.display = 'flex';
            } else {
                document.getElementById('tasksView').classList.add('active');
                document.querySelector('.page-toggle button:last-child').classList.add('active');
                document.querySelector('.page-toggle button:last-child').classList.remove('inactive');
                renderTasks();
                isReadOnly = selectedDate.toDateString() !== new Date().toDateString();
                if (isReadOnly) {
                    document.getElementById('addTaskSection').style.display = 'none';
                } else {
                    document.getElementById('addTaskSection').style.display = 'flex';
                }
            }
        }

        // Get tasks for a specific date
        function getTasksForDate(date) {
            const dateStr = date.toISOString().split('T')[0];
            return tasks.filter(task => task.date === dateStr);
        }

        // Format date to YYYY-MM-DD
        function formatDateKey(date) {
            const d = new Date(date);
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${d.getFullYear()}-${month}-${day}`;
        }

        // Render calendar
        function renderCalendar() {
            const year = currentMonth.getFullYear();
            const month = currentMonth.getMonth();

            // Update header
            document.getElementById('calendarMonth').textContent = `${monthNames[month]} ${year}`;

            // Get first day and number of days
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const daysInPrevMonth = new Date(year, month, 0).getDate();

            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';

            // Add day headers
            daysOfWeek.forEach(day => {
                const header = document.createElement('div');
                header.className = 'calendar-day-header';
                header.textContent = day;
                grid.appendChild(header);
            });

            // Add previous month's days
            for (let i = firstDay - 1; i >= 0; i--) {
                const day = daysInPrevMonth - i;
                const dayEl = createDayElement(day, new Date(year, month - 1, day), true);
                grid.appendChild(dayEl);
            }

            // Add current month's days
            for (let day = 1; day <= daysInMonth; day++) {
                const dayEl = createDayElement(day, new Date(year, month, day), false);
                grid.appendChild(dayEl);
            }

            // Add next month's days
            const remainingDays = 42 - (firstDay + daysInMonth);
            for (let day = 1; day <= remainingDays; day++) {
                const dayEl = createDayElement(day, new Date(year, month + 1, day), true);
                grid.appendChild(dayEl);
            }
        }

        // Create a day element
        function createDayElement(day, date, isOtherMonth) {
            const el = document.createElement('div');
            el.className = 'calendar-day';

            if (isOtherMonth) {
                el.classList.add('other-month');
            }

            const dateStr = formatDateKey(date);
            const today = formatDateKey(new Date());

            if (dateStr === today) {
                el.classList.add('today');
            }

            if (dateStr === formatDateKey(selectedDate)) {
                el.classList.add('selected');
            }

            // Add completion indicator
            const dayTasks = getTasksForDate(date);
            if (dayTasks.length > 0) {
                el.classList.add('has-tasks');
                const completed = dayTasks.filter(t => t.completed).length;
                const indicator = document.createElement('div');
                indicator.className = 'completion-indicator';

                if (completed === dayTasks.length) {
                    indicator.classList.add('complete');
                } else if (completed > 0) {
                    indicator.classList.add('partial');
                }

                el.appendChild(indicator);
            }

            el.textContent = day;

            if (!isOtherMonth) {
                el.addEventListener('click', () => selectDate(date));
            }

            return el;
        }

        // Select a date
        function selectDate(date) {
            selectedDate = new Date(date);
            const dateStr = formatDateKey(selectedDate);
            const today = formatDateKey(new Date());
            isReadOnly = dateStr !== today;
            
            document.getElementById('selectedDateDisplay').textContent = 
                selectedDate.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
            
            renderCalendar();
            filterTasks('all');
            renderTasks();
            updateStats();
            
            if (isReadOnly) {
                document.getElementById('addTaskSection').style.display = 'none';
            } else {
                document.getElementById('addTaskSection').style.display = 'flex';
            }
        }

        // Navigate months
        function previousMonth() {
            currentMonth = new Date(currentMonth.getFullYear(), currentMonth.getMonth() - 1);
            renderCalendar();
        }

        function nextMonth() {
            currentMonth = new Date(currentMonth.getFullYear(), currentMonth.getMonth() + 1);
            // Limit to 2026
            if (currentMonth.getFullYear() > 2026) {
                currentMonth = new Date(2026, 11, 1);
            }
            renderCalendar();
        }

        // Add a new task
        function addTask() {
            if (isReadOnly) {
                alert('Cannot add tasks to past dates');
                return;
            }

            const input = document.getElementById('taskInput');
            const priority = document.getElementById('prioritySelect').value;
            const text = input.value.trim();

            if (text === '') {
                alert('Please enter a task description');
                return;
            }

            const task = {
                id: Date.now(),
                text: text,
                priority: priority,
                completed: false,
                date: formatDateKey(selectedDate),
                createdAt: new Date().toLocaleString()
            };

            tasks.push(task);
            saveTasks();
            input.value = '';
            renderCalendar();
            renderTasks();
            updateStats();
        }

        // Delete a task
        function deleteTask(id) {
            if (isReadOnly) {
                alert('Cannot delete tasks from past dates');
                return;
            }

            if (confirm('Are you sure you want to delete this task?')) {
                tasks = tasks.filter(task => task.id !== id);
                saveTasks();
                renderCalendar();
                renderTasks();
                updateStats();
            }
        }

        // Toggle task completion
        function toggleComplete(id) {
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.completed = !task.completed;
                saveTasks();
                renderCalendar();
                renderTasks();
                updateStats();
            }
        }

        // Open edit modal
        function openEditModal(id) {
            if (isReadOnly) {
                alert('Cannot edit tasks from past dates');
                return;
            }

            const task = tasks.find(t => t.id === id);
            if (task) {
                editingTaskId = id;
                document.getElementById('editTaskText').value = task.text;
                document.getElementById('editPriority').value = task.priority;
                document.getElementById('editModal').classList.add('active');
                document.getElementById('editTaskText').focus();
            }
        }

        // Close edit modal
        function closeEditModal() {
            document.getElementById('editModal').classList.remove('active');
            editingTaskId = null;
        }

        // Save edited task
        function saveEdit() {
            const text = document.getElementById('editTaskText').value.trim();
            const priority = document.getElementById('editPriority').value;

            if (text === '') {
                alert('Please enter a task description');
                return;
            }

            const task = tasks.find(t => t.id === editingTaskId);
            if (task) {
                task.text = text;
                task.priority = priority;
                saveTasks();
                renderCalendar();
                renderTasks();
                updateStats();
                closeEditModal();
            }
        }

        // Filter tasks
        function filterTasks(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            renderTasks();
        }

        // Render tasks for selected date
        function renderTasks() {
            const taskList = document.getElementById('taskList');
            let dayTasks = getTasksForDate(selectedDate);
            let filteredTasks = dayTasks;

            if (currentFilter === 'high') {
                filteredTasks = dayTasks.filter(t => t.priority === 'high');
            } else if (currentFilter === 'medium') {
                filteredTasks = dayTasks.filter(t => t.priority === 'medium');
            } else if (currentFilter === 'low') {
                filteredTasks = dayTasks.filter(t => t.priority === 'low');
            } else if (currentFilter === 'completed') {
                filteredTasks = dayTasks.filter(t => t.completed);
            }

            // Sort by completion status and priority
            const priorityOrder = { high: 0, medium: 1, low: 2 };
            filteredTasks.sort((a, b) => {
                if (a.completed !== b.completed) {
                    return a.completed ? 1 : -1;
                }
                return priorityOrder[a.priority] - priorityOrder[b.priority];
            });

            if (filteredTasks.length === 0) {
                taskList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📭</div>
                        <div>No tasks ${currentFilter !== 'all' ? 'in this category' : 'for this date'}. ${currentFilter === 'all' && !isReadOnly ? 'Add one to get started!' : ''}</div>
                    </div>
                `;
                return;
            }

            taskList.innerHTML = filteredTasks.map(task => `
                <div class="task-item ${task.priority} ${task.completed ? 'completed' : ''} ${isReadOnly ? 'readonly' : ''}">
                    <input type="checkbox" ${task.completed ? 'checked' : ''} ${isReadOnly ? 'disabled' : ''} onchange="toggleComplete(${task.id})">
                    <div class="task-content">
                        <div class="task-text">${escapeHtml(task.text)}</div>
                        <span class="task-priority ${task.priority}">
                            ${task.priority === 'high' ? '🔴' : task.priority === 'medium' ? '🟡' : '🟢'} ${task.priority}
                        </span>
                        ${isReadOnly ? `<div class="task-date">Created: ${task.createdAt}</div>` : ''}
                    </div>
                    <div class="task-actions">
                        <button class="btn-edit" onclick="openEditModal(${task.id})" ${isReadOnly ? 'disabled' : ''}>Edit</button>
                        <button class="btn-delete" onclick="deleteTask(${task.id})" ${isReadOnly ? 'disabled' : ''}>Delete</button>
                    </div>
                </div>
            `).join('');
        }

        // Update statistics for selected date
        function updateStats() {
            const dayTasks = getTasksForDate(selectedDate);
            const total = dayTasks.length;
            const completed = dayTasks.filter(t => t.completed).length;
            const remaining = total - completed;

            document.getElementById('totalTasks').textContent = total;
            document.getElementById('completedTasks').textContent = completed;
            document.getElementById('remainingTasks').textContent = remaining;
        }

        // Save tasks to localStorage
        function saveTasks() {
            localStorage.setItem('tasks', JSON.stringify(tasks));
        }

        // Escape HTML to prevent XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Close modal when clicking outside
        document.getElementById('editModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeEditModal();
            }
        });

        // Initialize the app when page loads
        window.addEventListener('load', init);
    </script>
</body>
</html>
