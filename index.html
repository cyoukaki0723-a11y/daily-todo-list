<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Portfolio | Interactive Experience</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Entry Page Styles */
        .entry-page {
            position: relative;
            width: 100%;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            perspective: 1000px;
        }

        .modules-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            height: 600px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Circular Modules */
        .module {
            position: absolute;
            cursor: pointer;
            transition: all 0.3s ease;
            animation: float 3s ease-in-out infinite;
        }

        .module-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            border: 3px solid rgba(255, 255, 255, 0.3);
            position: relative;
            overflow: hidden;
        }

        .module-circle::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, transparent 30%, rgba(255, 255, 255, 0.3) 50%, transparent 70%);
            transform: translateX(-100%);
            animation: shine 3s infinite;
        }

        @keyframes shine {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .module:hover .module-circle {
            transform: scale(1.15);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            border-color: rgba(255, 255, 255, 0.6);
        }

        .module-icon {
            font-size: 40px;
            margin-bottom: 5px;
            transition: transform 0.3s ease;
        }

        .module:hover .module-icon {
            transform: scale(1.2);
        }

        .module-label {
            font-size: 12px;
            font-weight: 600;
            color: white;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Module Positions (Orbital Layout) */
        .module:nth-child(1) { animation-delay: 0s; }
        .module:nth-child(2) { animation-delay: 0.5s; }
        .module:nth-child(3) { animation-delay: 1s; }
        .module:nth-child(4) { animation-delay: 1.5s; }
        .module:nth-child(5) { animation-delay: 2s; }
        .module:nth-child(6) { animation-delay: 2.5s; }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        /* Position modules in a circular pattern */
        .module {
            width: 140px;
            height: 140px;
        }

        .module[data-module="study"] {
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
        }

        .module[data-module="internship"] {
            top: 40px;
            right: -30px;
        }

        .module[data-module="work"] {
            bottom: 40px;
            right: -30px;
        }

        .module[data-module="skills"] {
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
        }

        .module[data-module="mbti"] {
            bottom: 40px;
            left: -30px;
        }

        .module[data-module="evaluations"] {
            top: 40px;
            left: -30px;
        }

        /* Center Info Circle */
        .center-info {
            position: absolute;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            z-index: 10;
            animation: centerPulse 2s ease-in-out infinite;
        }

        @keyframes centerPulse {
            0%, 100% { box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3); }
            50% { box-shadow: 0 30px 80px rgba(102, 126, 234, 0.4); }
        }

        .center-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            overflow: hidden;
            margin-bottom: 10px;
            border: 3px solid #667eea;
            flex-shrink: 0;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .center-name {
            font-size: 16px;
            font-weight: 700;
            color: #333;
            margin-bottom: 3px;
        }

        .center-title {
            font-size: 11px;
            color: #667eea;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .center-social {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .social-icon {
            font-size: 8px;
            padding: 3px 6px;
            background: #667eea;
            color: white;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .social-icon:hover {
            background: #764ba2;
            transform: scale(1.1);
        }

        /* Detail Page Styles */
        .detail-page {
            display: none;
            width: 100%;
            min-height: 100vh;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .detail-page.active {
            display: block;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .detail-container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            min-height: 80vh;
            display: flex;
            flex-direction: column;
        }

        .detail-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .back-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #667eea;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }

        .back-btn:hover {
            background: #764ba2;
            transform: scale(1.1);
        }

        .detail-title {
            font-size: 28px;
            color: #333;
            margin: 0;
        }

        .detail-content {
            flex: 1;
        }

        .content-section {
            margin-bottom: 25px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            color: #667eea;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .content-item {
            margin-bottom: 15px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .item-title {
            font-size: 15px;
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .item-subtitle {
            font-size: 12px;
            color: #667eea;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .item-description {
            font-size: 14px;
            color: #666;
            line-height: 1.5;
        }

        .skill-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .skill-tag {
            display: inline-block;
            padding: 6px 12px;
            background: #667eea;
            color: white;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .rating {
            display: flex;
            gap: 5px;
            margin-top: 10px;
        }

        .star {
            font-size: 18px;
        }

        .star.filled {
            color: #f39c12;
        }

        .star.empty {
            color: #ddd;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .modules-container {
                height: 500px;
                max-width: 400px;
            }

            .module {
                width: 100px;
                height: 100px;
            }

            .module-circle {
                width: 100px;
                height: 100px;
            }

            .module-icon {
                font-size: 32px;
                margin-bottom: 3px;
            }

            .module-label {
                font-size: 10px;
            }

            .center-info {
                width: 150px;
                height: 150px;
            }

            .center-avatar {
                width: 60px;
                height: 60px;
            }

            .center-name {
                font-size: 14px;
            }

            .detail-container {
                padding: 20px;
                min-height: auto;
            }

            .detail-title {
                font-size: 24px;
            }
        }

        @media (max-width: 480px) {
            .modules-container {
                height: 450px;
            }

            .module {
                width: 90px;
                height: 90px;
            }

            .module-circle {
                width: 90px;
                height: 90px;
            }

            .module-icon {
                font-size: 28px;
            }

            .center-info {
                width: 130px;
                height: 130px;
            }

            .entry-page {
                padding: 15px;
            }
        }
    </style>
</head>
<body>

        // Initialize modules
        document.addEventListener('DOMContentLoaded', () => {
            const modules = document.querySelectorAll('.module');
            modules.forEach(module => {
                module.addEventListener('click', () => {
                    const moduleType = module.dataset.module;
                    showDetailPage(moduleType);
                });
            });

            const backBtn = document.getElementById('backBtn');
            backBtn.addEventListener('click', showEntryPage);
        });

        function showDetailPage(moduleType) {
            const entryPage = document.getElementById('entryPage');
            const detailPage = document.getElementById('detailPage');
            const data = moduleData[moduleType];

            document.getElementById('detailTitle').textContent = data.title;
            document.getElementById('detailContent').innerHTML = data.content;

            entryPage.style.display = 'none';
            detailPage.classList.add('active');
        }

        function showEntryPage() {
            const entryPage = document.getElementById('entryPage');
            const detailPage = document.getElementById('detailPage');

            entryPage.style.display = 'flex';
            detailPage.classList.remove('active');
        }
    </script>
</body>
</html>
